name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Install tested dependency set
        run: >-
          python -m pip install
          numpy==1.26.4
          scipy==1.13.1
          opencv-python-headless==4.10.0.84
          pytest==8.3.5
      - run: python -m compileall -q scharr_fourier scripts tests
      - run: pytest
      - run: python scripts/benchmark.py --size 128 --output outputs/benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-py${{ matrix.python-version }}
          path: outputs/benchmark
