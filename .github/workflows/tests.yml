name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Install runtime and test dependencies
        run: python -m pip install numpy scipy opencv-python-headless pytest
      - run: python -m compileall -q scharr_fourier scripts tests
      - name: Run tests with diagnostics
        run: pytest --junitxml=outputs/junit-py${{ matrix.python-version }}.xml
      - run: python scripts/benchmark.py --size 128 --output outputs/benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-py${{ matrix.python-version }}
          path: outputs
