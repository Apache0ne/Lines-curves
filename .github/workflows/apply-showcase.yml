name: apply-readme-showcase

on:
  push:
    paths:
      - assets/showcase_payload.ready
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode showcase payload
        run: |
          python - <<'PY'
          import base64, pathlib, zipfile
          parts = sorted(pathlib.Path('assets').glob('showcase_payload.part*'))
          if not parts:
              raise SystemExit('No showcase payload parts found')
          encoded = ''.join(part.read_text().strip() for part in parts)
          archive = pathlib.Path('/tmp/showcase_payload.zip')
          archive.write_bytes(base64.b64decode(encoded))
          with zipfile.ZipFile(archive) as z:
              z.extractall('.')
          PY
          rm -f assets/showcase_payload.part* assets/showcase_payload.ready docs/showcase/README.txt
      - name: Commit showcase gallery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md docs/showcase assets .github/workflows/apply-showcase.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add aircraft benchmark showcase gallery"
            git push origin HEAD:main
          fi
